spring.application.name=reviews-service
server.port=8087

spring.datasource.url=jdbc:mysql://localhost:3306/dittostore_reviews?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.config.import=optional:configserver:http://localhost:8888

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1

dittostore.rabbitmq.exchanges.pedido-topic=pedido.topic.exchange
dittostore.rabbitmq.exchanges.pago-topic=pago.topic.exchange
dittostore.rabbitmq.exchanges.dlx=reviews.dlx.exchange

dittostore.rabbitmq.queues.pedido.name=reviews.pedido.queue
dittostore.rabbitmq.queues.pedido.dlq=reviews.pedido.dlq
dittostore.rabbitmq.queues.pedido.routing-key=pedido.estado.*

dittostore.rabbitmq.queues.pago.name=reviews.pago.queue
dittostore.rabbitmq.queues.pago.dlq=reviews.pago.dlq
dittostore.rabbitmq.queues.pago.routing-key=pago.estado.*

dittostore.rabbitmq.retry.max-intentos=3
dittostore.rabbitmq.retry.backoff-ms=2000

dittostore.rabbitmq.dlq-listener.enabled=true