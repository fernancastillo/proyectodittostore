spring.application.name=reviews-service
server.port=8087

spring.datasource.url=jdbc:mysql://localhost:3306/dittostore_reviews?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.config.import=optional:configserver:http://localhost:8888
# ---------- RabbitMQ ----------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------- Nombres de mensajería (centralizados) ----------
ditto.rabbit.exchanges.pedidos=pedidos.exchange
ditto.rabbit.exchanges.pagos=pagos.exchange
ditto.rabbit.exchanges.dlx=reviews.dlx
ditto.rabbit.queues.pedido-creado=reviews.pedido-creado.queue
ditto.rabbit.queues.pago-aprobado=reviews.pago-aprobado.queue
ditto.rabbit.queues.dlq=reviews.dlq
ditto.rabbit.routing-keys.pedido-creado=pedido.creado
ditto.rabbit.routing-keys.pago-aprobado=pago.aprobado
