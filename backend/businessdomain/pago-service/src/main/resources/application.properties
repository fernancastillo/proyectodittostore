spring.application.name=pago-service
server.port=8086

spring.datasource.url=jdbc:mysql://localhost:3306/dittostore_pago?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.config.import=optional:configserver:http://localhost:8888

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false

ditto.rabbit.exchanges.pagos=pagos.exchange
ditto.rabbit.exchanges.dlx=pagos.dlx
ditto.rabbit.queues.notificacion=pago.notificacion.queue
ditto.rabbit.queues.comprobante=pago.comprobante.queue
ditto.rabbit.queues.rechazado=pago.rechazado.queue
ditto.rabbit.queues.dlq-notificacion=pago.notificacion.dlq
ditto.rabbit.queues.dlq-comprobante=pago.comprobante.dlq
ditto.rabbit.queues.dlq-rechazado=pago.rechazado.dlq
ditto.rabbit.routing-keys.pago-creado=pago.creado
ditto.rabbit.routing-keys.pago-aprobado=pago.aprobado
ditto.rabbit.routing-keys.pago-rechazado=pago.rechazado
ditto.rabbit.routing-keys.pago-todos=pago.*
ditto.rabbit.routing-keys.dlq-notificacion=dlq.notificacion
ditto.rabbit.routing-keys.dlq-comprobante=dlq.comprobante
ditto.rabbit.routing-keys.dlq-rechazado=dlq.rechazado