spring.application.name=pedidos-service
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/dittostore_pedidos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.config.import=optional:configserver:http://localhost:8888

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1

dittostore.rabbitmq.exchanges.pedido-topic=pedido.topic.exchange
dittostore.rabbitmq.exchanges.pago-topic=pago.topic.exchange
dittostore.rabbitmq.exchanges.dlx=pedidos.dlx.exchange
dittostore.rabbitmq.routing-keys.estado-prefix=pedido.estado

dittostore.rabbitmq.queues.pago.name=pedidos.pago.queue
dittostore.rabbitmq.queues.pago.dlq=pedidos.pago.dlq
dittostore.rabbitmq.queues.pago.routing-key=pago.estado.*

dittostore.rabbitmq.retry.max-intentos=3
dittostore.rabbitmq.retry.backoff-ms=2000


dittostore.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
dittostore.kafka.topics.pedidos-eventos=pedidos.eventos


dittostore.kafka.topics.pagos-alertas=pagos.alertas
dittostore.kafka.consumer.group-alertas=pedidos-alertas-group
dittostore.kafka.consumer.concurrency=1
dittostore.kafka.retry.max-intentos=3
dittostore.kafka.retry.backoff-ms=2000