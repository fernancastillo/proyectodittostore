spring.application.name=producto-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/dittostore_producto?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.config.import=optional:configserver:http://localhost:8888


dittostore.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
dittostore.kafka.topics.pedidos-eventos=pedidos.eventos
dittostore.kafka.consumer.group-ventas=producto-ventas-group
dittostore.kafka.consumer.concurrency=3
dittostore.kafka.retry.max-intentos=3
dittostore.kafka.retry.backoff-ms=2000