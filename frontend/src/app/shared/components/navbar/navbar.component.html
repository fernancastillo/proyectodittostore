<header class="navbar">
  <div class="navbar__row container">
    <a routerLink="/" class="navbar__brand" (click)="closeMenu()">
      <img
        class="navbar__brand-icon"
        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/132.png"
        alt="Mascota Ditto"
        width="44"
        height="44"
      />
      <span>Ditto Store</span>
    </a>

    <nav class="navbar__links" [class.navbar__links--open]="menuOpen()">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: !!link.exact }"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="navbar__actions">
      <button type="button" class="navbar__icon-btn" aria-label="Buscar cartas">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>

      <a routerLink="/carrito" class="navbar__icon-btn" aria-label="Ver carrito">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
          <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="10" cy="20" r="1.4" fill="currentColor" />
          <circle cx="17" cy="20" r="1.4" fill="currentColor" />
        </svg>
      </a>

      <a routerLink="/cuenta" class="navbar__icon-btn navbar__icon-btn--profile" aria-label="Tu cuenta">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
          <circle cx="12" cy="8.5" r="3.5" stroke="currentColor" stroke-width="2" />
          <path d="M4.5 20c1.4-3.4 4.3-5.2 7.5-5.2s6.1 1.8 7.5 5.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </a>

      <button
        type="button"
        class="navbar__burger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Abrir menú de navegación"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
