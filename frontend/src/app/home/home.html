<section class="hero">
  <div class="hero-content">
    <h2>Descubre la mejor tecnología</h2>
    <p>Explora nuestro catálogo y encuentra ofertas increíbles exclusivas para ti.</p>
    <a routerLink="/productos" class="btn btn-primary btn-large">Ver Productos</a>
  </div>
</section>

<section class="featured-section">
  <h3 class="section-title">Nuestros Productos</h3>

  <div class="products-grid">
    @for (producto of productosDestacados; track producto.id) {
      <article class="product-card">
        <img [src]="producto.imagenUrl" [alt]="producto.nombre" class="product-img">
        <div class="product-info">
          <h4 class="product-name">{{ producto.nombre }}</h4>
          <p class="product-price">${{ producto.precio | number:'1.0-0' }}</p>
          <a class="btn btn-secondary w-100" [routerLink]="['/productos', producto.id]">
            Ver Detalles
          </a>
        </div>
      </article>
    }
  </div>
</section>
