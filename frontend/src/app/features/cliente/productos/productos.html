<section class="featured-section">
  <h3 class="section-title">Catálogo completo</h3>

  <div class="products-grid">
    @for (producto of productos; track producto.id) {
      <article class="product-card">
        <img [src]="producto.imagenUrl" [alt]="producto.nombre" class="product-img">
        <div class="product-info">
          <h4 class="product-name">{{ producto.nombre }}</h4>
          <p class="product-price">${{ producto.precio | number:'1.0-0' }}</p>
          <button class="btn btn-secondary w-100" (click)="agregarAlCarrito(producto)">
            Agregar al carrito
          </button>
        </div>
      </article>
    } @empty {
      <p>No hay productos disponibles por el momento.</p>
    }
  </div>
</section>
